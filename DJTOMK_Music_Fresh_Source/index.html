<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12"><title>DJ TOMK MUSIC</title>
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111722;--line:#253044;--text:#f4f7fb;--muted:#99a7bc;--blue:#28d7ff;--pink:#ff356e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#13243a 0,#080b12 55%);font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--text);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:28px 18px 120px}.brand{display:flex;align-items:center;gap:14px}.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),#3754ff);color:#071018;font-weight:1000;font-size:20px;box-shadow:0 0 35px #28d7ff35}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--blue);font-weight:800}.brand h1{font-size:clamp(25px,5vw,42px);margin:3px 0;letter-spacing:-.04em}.hero{padding:42px 0 24px}.hero h2{font-size:clamp(34px,7vw,66px);line-height:.98;margin:0;letter-spacing:-.06em}.hero h2 span{color:var(--blue)}.hero p{color:var(--muted);max-width:580px;line-height:1.6}.search{display:flex;gap:10px;margin:22px 0}.search input{flex:1;min-width:0;background:#101722;border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:white;font:inherit;outline:none}.search input:focus{border-color:var(--blue)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.section-head h3{margin:0;font-size:20px}.count{font-size:12px;color:var(--muted)}.list{display:grid;gap:10px}.track{display:flex;align-items:center;gap:14px;background:linear-gradient(110deg,#131b28,#0d121c);border:1px solid var(--line);border-radius:16px;padding:13px}.cover{width:52px;height:52px;flex:0 0 52px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#1f5265,#25245e);color:var(--blue);font-size:21px}.info{flex:1;min-width:0}.title{font-weight:800;overflow-wrap:anywhere}.artist{font-size:13px;color:var(--muted);margin-top:5px}.play{border:0;border-radius:50%;width:44px;height:44px;flex:0 0 44px;background:var(--blue);color:#061018;font-size:18px;font-weight:900;cursor:pointer}.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted);line-height:1.6}.player{position:fixed;bottom:0;left:0;right:0;background:#0b1019ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:12px max(16px,calc((100vw - 1014px)/2));display:grid;grid-template-columns:1fr minmax(160px,2fr) 1fr;gap:16px;align-items:center}.now{min-width:0}.now strong,.now span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now span{font-size:12px;color:var(--muted);margin-top:4px}.controls{display:flex;justify-content:center;align-items:center;gap:14px}.controls button{background:none;border:0;color:white;font-size:22px;cursor:pointer}.progress{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--blue)}.volume{display:flex;align-items:center;gap:8px}.volume input{max-width:100px}.footer{color:#65748a;text-align:center;font-size:12px;margin-top:30px}@media(max-width:650px){.player{grid-template-columns:1fr auto;gap:8px}.controls{grid-column:2;grid-row:1}.progress{grid-column:1/-1;grid-row:2}.volume{display:none}.wrap{padding-top:20px}.hero{padding-top:32px}}
</style></head>
<body><main class="wrap"><header class="brand"><div class="logo">T</div><div><div class="eyebrow">OFFICIAL MUSIC HUB</div><h1>DJ TOMK <span style="color:var(--blue)">MUSIC</span></h1></div></header>
<section class="hero"><div class="eyebrow">LISTEN • FEEL • REPEAT</div><h2>ÂM NHẠC CỦA<br><span>DJ TOMK.</span></h2><p>Thư viện nhạc và bản phối được tuyển chọn. Chọn một track để phát trực tiếp.</p></section>
<div class="search"><input id="search" type="search" placeholder="Tìm tên bài hát hoặc nghệ sĩ…" aria-label="Tìm bài hát"></div>
<div class="section-head"><h3>Thư viện nhạc</h3><span id="count" class="count">Đang tải…</span></div><div id="list" class="list"><div class="empty">Đang tải danh sách nhạc…</div></div><div class="footer">DJ TOMK MUSIC · Powered by Cloudflare Pages + R2</div></main>
<footer class="player"><div class="now"><strong id="nowTitle">Chưa chọn bài hát</strong><span id="nowArtist">DJ TOMK</span></div><div><div class="controls"><button id="back" aria-label="Bài trước">⏮</button><button id="toggle" aria-label="Phát hoặc tạm dừng">▶</button><button id="next" aria-label="Bài tiếp">⏭</button></div><div class="progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><div class="volume"><span>VOL</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></footer>
<audio id="audio" preload="metadata"></audio>
<script>
const $=s=>document.querySelector(s);const audio=$('#audio');let tracks=[],filtered=[],current=-1;
const fmt=n=>{if(!Number.isFinite(n))return '0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')};
function render(){const list=$('#list');$('#count').textContent=`${filtered.length} track${filtered.length===1?'':'s'}`;if(!filtered.length){list.innerHTML='<div class="empty">Chưa có bài hát phù hợp. Kiểm tra API hoặc thử từ khóa khác.</div>';return}list.innerHTML='';filtered.forEach((t,i)=>{const row=document.createElement('article');row.className='track';const cover=document.createElement('div');cover.className='cover';cover.textContent='♫';const info=document.createElement('div');info.className='info';const title=document.createElement('div');title.className='title';title.textContent=t.title||t.name||'Không tên';const artist=document.createElement('div');artist.className='artist';artist.textContent=t.artist||'DJ TOMK';info.append(title,artist);const btn=document.createElement('button');btn.className='play';btn.textContent='▶';btn.setAttribute('aria-label','Phát '+title.textContent);btn.onclick=()=>playTrack(i);row.append(cover,info,btn);list.append(row)})}
function playTrack(i){if(i<0||i>=filtered.length)return;current=i;const t=filtered[i];audio.src=t.url||('/api/audio?key='+encodeURIComponent(t.key||''));$('#nowTitle').textContent=t.title||t.name||'Không tên';$('#nowArtist').textContent=t.artist||'DJ TOMK';audio.play().then(()=>$('#toggle').textContent='Ⅱ').catch(()=>{ $('#toggle').textContent='▶'; });}
async function load(){try{const r=await fetch('/api/tracks',{cache:'no-store'});if(!r.ok)throw Error('API trả về '+r.status);const d=await r.json();tracks=Array.isArray(d)?d:(d.tracks||[]);filtered=tracks;render()}catch(e){$('#count').textContent='Không kết nối được';$('#list').innerHTML='<div class="empty">Không tải được danh sách nhạc.<br>Kiểm tra Functions và binding R2 MUSIC_BUCKET trên Cloudflare Pages.<br><small>'+e.message+'</small></div>'}}
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLocaleLowerCase('vi');filtered=tracks.filter(t=>`${t.title||t.name||''} ${t.artist||''}`.toLocaleLowerCase('vi').includes(q));render()});$('#toggle').onclick=()=>{if(!audio.src){if(filtered.length)playTrack(0);return}if(audio.paused)audio.play().then(()=>$('#toggle').textContent='Ⅱ').catch(()=>{});else audio.pause()};audio.addEventListener('play',()=>$('#toggle').textContent='Ⅱ');audio.addEventListener('pause',()=>$('#toggle').textContent='▶');audio.addEventListener('timeupdate',()=>{if(audio.duration){$('#seek').value=audio.currentTime/audio.duration*100;$('#elapsed').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration)}});$('#seek').oninput=()=>{if(audio.duration)audio.currentTime=Number($('#seek').value)/100*audio.duration};$('#volume').oninput=e=>audio.volume=Number(e.target.value);audio.volume=.8;$('#next').onclick=()=>playTrack((current+1)%filtered.length);$('#back').onclick=()=>playTrack((current-1+filtered.length)%filtered.length);audio.addEventListener('ended',()=>{if(filtered.length)playTrack((current+1)%filtered.length)});load();
</script></body></html>
